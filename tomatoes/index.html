<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tomato icon comparison · SeedMe</title>
  <meta name="description" content="Compare the SeedMe tomato and yellow cherry tomato icons side by side.">
  <link rel="icon" href="/icon.png">
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f1eb; color: #28231f; }
    main { max-width: 900px; margin: auto; padding: clamp(24px, 5vw, 56px) 20px 72px; }
    h1 { margin: 0 0 8px; font-size: clamp(30px, 5vw, 44px); letter-spacing: -.04em; }
    p { margin: 0; line-height: 1.5; color: #6c6259; }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 3vw, 24px); margin-top: 30px; }
    .card { min-width: 0; border-radius: 24px; background: #fff; padding: clamp(12px, 3vw, 24px); box-shadow: 0 6px 22px #2b261b0d; text-align: center; }
    .art { display: grid; place-items: center; min-height: 200px; aspect-ratio: 1; border-radius: 17px; background: #f8f6f1; }
    .art img { display: block; width: min(100%, 320px); aspect-ratio: 1; object-fit: contain; }
    .cherry img { transform: scale(.48); }
    h2 { margin: 17px 0 3px; font-size: clamp(18px, 3vw, 24px); }
    .small { margin-top: 32px; padding: 24px; border-radius: 24px; background: #fff; }
    .small h2 { margin: 0 0 5px; }
    .small .pair { margin-top: 22px; }
    .sample { display: grid; place-items: center; gap: 8px; }
    .sample img { width: 64px; height: 64px; object-fit: contain; }
    .sample span { font-size: 13px; color: #6c6259; }
    @media (max-width: 520px) { .card { padding: 10px; } .art { min-height: 145px; } }
    @media (prefers-color-scheme: dark) {
      body { background: #141414; color: #f6f1e8; }
      p, .sample span { color: #bdb3a6; }
      .card, .small { background: #222; }
      .art { background: #303030; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Tomato icons, side by side</h1>
    <p>The yellow cherry tomato is shown at about one-third of the normal tomato's visible width.</p>
    <div class="pair" aria-label="Tomato icon comparison">
      <section class="card">
        <div class="art"><img src="normal-tomato.webp" alt="Large glossy red tomato with green stem"></div>
        <h2>Normal tomato</h2>
        <p>Red · full size</p>
      </section>
      <section class="card cherry">
        <div class="art"><img src="yellow-cherry-tomato.webp" alt="Smaller glossy yellow cherry tomato with green stem"></div>
        <h2>Cherry tomato</h2>
        <p>Yellow · smaller</p>
      </section>
    </div>
    <section class="small" aria-label="Icons at app size">
      <h2>At app size</h2>
      <p>Each image is shown in the same 64 px box.</p>
      <div class="pair">
        <div class="sample"><img src="normal-tomato.webp" alt="Normal tomato at app size"><span>Normal</span></div>
        <div class="sample cherry"><img src="yellow-cherry-tomato.webp" alt="Cherry tomato at app size"><span>Cherry</span></div>
      </div>
    </section>
  </main>
</body>
</html>
